name: RaceDay Part 2 CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore RaceDay.slnx
      - name: Build
        run: dotnet build RaceDay.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test RaceDay.slnx --no-build --configuration Release --logger 'console;verbosity=normal'
