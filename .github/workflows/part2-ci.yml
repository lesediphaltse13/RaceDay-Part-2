name: RaceDay Part 2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      Jwt__Key: RaceDayLocalTestSigningKey2026AtLeast32Bytes!
      Jwt__Issuer: RaceDay.Api
      Jwt__Audience: RaceDay.Client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      - name: Build solution
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Run automated tests
        run: dotnet test RaceDay.sln --no-build --configuration Release --logger "console;verbosity=normal"
